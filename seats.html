<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>열람실 좌석 예약 · 중앙대학교 인문대학 제15대 학생회 ‘연’</title>
<meta name="description" content="중앙대학교 인문대학 열람실 좌석을 예약합니다. 개방 시간 09시~21시, 매일 초기화됩니다.">
<meta name="theme-color" content="#F8E9D4">

<meta property="og:type" content="website">
<meta property="og:site_name" content="중앙대학교 인문대학 학생회">
<meta property="og:title" content="열람실 좌석 예약 · 중앙대학교 인문대학 학생회">
<meta property="og:description" content="빈 자리를 눌러 예약하세요. 개방 시간 09시~21시, 매일 초기화됩니다.">
<meta property="og:image" content="assets/logo.png">

<link rel="icon" href="assets/favicon.png?v=20260909c" type="image/png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=20260909c">
<script>document.documentElement.classList.add('js');
/* 상단바 이름은 저장된 값이 정해질 때까지 자리만 잡아둔다.
   먼저 html 에 적힌 기본 이름이 한 프레임 보였다가 바뀌는 게 눈에 띄었다.
   js 가 어떤 이유로든 못 돌면 1.5초 뒤에는 그냥 보여준다. */
setTimeout(function(){document.documentElement.classList.add('brand-ready');},1500);</script>
<link rel="stylesheet" href="css/style.css?v=20260909c">
</head>

<body data-page="seats">
<div class="page">

  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="wrap wrap--wide topbar__inner">
      <a class="topbar__brand" href="./">
        <span class="topbar__mark" data-logo><img src="assets/logo.png?v=20260909c" alt="" width="900" height="673"></span>
        <span class="topbar__name"><span class="topbar__name--long">중앙대학교 제15대 인문대학 학생회 ‘연(聯)’</span><span class="topbar__name--short">제15대 학생회 ‘연(聯)’</span></span>
      </a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="./">홈</a>
        <a href="notices.html">공지</a>
        <a href="seats.html" aria-current="page">열람실</a>
        <a href="apply.html">신청</a>
        <a href="./#links">링크</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap wrap--wide">
      <a class="back" href="./">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>
        홈으로
      </a>

      <div class="article">
        <h1 class="article__title" data-room-name>열람실 좌석 예약</h1>
        <p class="form-desc" data-room-desc></p>

        <!-- 운영 상태 / 오류 안내 -->
        <div class="banner" data-room-state hidden></div>

        <!-- 예약 확인증 -->
        <div data-ticket hidden></div>

        <!-- 좌석 선택 폼 -->
        <div data-seat-form hidden></div>

        <!-- 좌석표 -->
        <section data-map-section>
          <div class="seatmap__bar">
            <p class="seatmap__count" data-seat-count aria-live="polite"></p>
            <div class="seatmap__legend" data-legend>
              <span class="legend"><span class="legend__box legend__box--free"></span>빈 자리</span>
              <span class="legend"><span class="legend__box legend__box--taken"></span>예약됨</span>
            </div>
            <button type="button" class="btn" data-refresh>새로고침</button>
          </div>
          <div data-seatmap>
            <div class="skeleton" style="height:220px" aria-hidden="true"></div>
            <p class="sr-only">좌석표를 불러오는 중입니다.</p>
          </div>
        </section>

        <!-- 좌석배치 특이사항 -->
        <section class="roomnotes" data-seat-notes hidden aria-labelledby="seatnotes-title">
          <h2 id="seatnotes-title" class="roomnotes__title">좌석 안내</h2>
          <ul class="roomnotes__list" data-seat-notes-list></ul>
        </section>

        <!-- 이용 안내 -->
        <section class="roomnotes" aria-labelledby="roomnotes-title">
          <h2 id="roomnotes-title" class="roomnotes__title">이용 안내</h2>
          <ul class="roomnotes__list" data-room-notes></ul>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer__name">중앙대학교 인문대학 제15대 학생회 ‘연’</p>
      <div class="footer__links"><a href="./">홈으로</a><a href="notices.html">공지사항</a></div>
      <p class="footer__copy">© <span id="year"></span> 중앙대학교 인문대학 학생회 · <a href="admin.html" class="footer__admin">학생회 관리자</a></p>
    </div>
  </footer>

</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
